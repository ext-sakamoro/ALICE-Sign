# Determinism gates for this crate (ALICE-Law): G1, the floating-point
# methods whose results IEEE 754 does not require to be correctly rounded, and
# G10, the wall clock and OS randomness. The crate computes with integers and
# byte strings only; these lists keep such a call from coming in unnoticed.
# The entries are the ones ALICE-DB uses. CI runs clippy with -D warnings, and
# scripts/clippy_canary.py plants one call per entry and fails unless clippy
# flags each one.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::sin_cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
