    { path = "f32::exp", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::exp2", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::exp_m1", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::ln", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::ln_1p", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::log", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
