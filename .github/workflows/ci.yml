name: CI

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

# a newer commit on the same branch stops the older run; on main every commit
# gets its own group and is not stopped
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default)
        run: cargo test
      - name: Test (rand)
        run: cargo test --features rand
      - name: Strict verification (every test of tests/verify_strict.rs ran)
        run: scripts/run_tests.sh verify_strict=8 -- cargo test --test verify_strict
      - name: Leading zeros past 256 bits (every test of tests/leading_zeros.rs ran)
        run: scripts/run_tests.sh leading_zeros=3 -- cargo test --test leading_zeros
      - name: HMAC-SHA256 (every test of tests/hmac.rs ran)
        run: scripts/run_tests.sh hmac=6 -- cargo test --test hmac

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at
    # run time in both profiles, the static build configuration guard, and on
    # ubuntu / macOS the flags cargo really passes to rustc; and the golden
    # byte layouts (tests/golden.rs) on each OS
    name: Float environment and goldens (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      - name: Golden byte layouts (debug and release)
        run: |
          cargo test --test golden
          cargo test --release --test golden
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      - name: Effective rustc flags (default, rand, no default features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features rand
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's): its own tests, then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml (0 here);
      # the IR half is .github/workflows/g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
          # scripts/changed_paths.py decides whether the path-filtered workflows run; its own
          # tests, then the trigger lint (each pattern file equals its workflow's
          # pull_request paths, the gate job needs every job)
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_changed_paths.py
          "$PY" scripts/changed_paths.py sync

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (rand, all targets)
        run: cargo clippy --all-targets --features rand -- -D warnings
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings
      # the lists in clippy.toml (ALICE-Law G1 / G10) only gate anything if
      # clippy flags a call to them: a throwaway crate with the same clippy.toml
      # plants one banned call per row of scripts/clippy_canary_calls.tsv (0
      # rows fail); --check fails when the rows have drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        run: python3 scripts/clippy_canary.py

  no_std:
    name: no_std (bare-metal thumbv7em)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build (thumbv7em-none-eabihf)
        run: cargo build --lib --target thumbv7em-none-eabihf
      - name: Clippy (thumbv7em-none-eabihf)
        run: cargo clippy --lib --target thumbv7em-none-eabihf -- -D warnings
      # timestamp and vc are no_std + alloc too
      - name: Build (thumbv7em-none-eabihf, timestamp + vc)
        run: cargo build --lib --target thumbv7em-none-eabihf --features timestamp,vc
      - name: Clippy (thumbv7em-none-eabihf, timestamp + vc)
        run: cargo clippy --lib --target thumbv7em-none-eabihf --features timestamp,vc -- -D warnings

  wasm32:
    name: wasm32 (the same tests pass under wasmtime as on the host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # the wasm targets come from rust-toolchain.toml (the pinned toolchain cargo uses)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: Build (wasm32-unknown-unknown, the browser target)
        run: |
          cargo build --locked --lib --target wasm32-unknown-unknown
          cargo build --locked --lib --target wasm32-unknown-unknown --all-features
      # Every test that passes on the host must also pass on wasm32-wasip1: the passed counts must be equal and
      # not zero, for the default features and for all features (doctests do not run on a cross target, so both
      # sides count unit and integration tests only).
      - name: Tests under wasmtime equal the host's
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          set -euo pipefail
          count() { sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -E '^test result: ' | awk '{s += $4} END {print s + 0}'; }
          for features in "" "--all-features"; do
            cargo test --locked --lib --tests ${features} 2>&1 | tee host.log
            cargo test --locked --lib --tests --target wasm32-wasip1 ${features} 2>&1 | tee wasm.log
            if grep -E '^test result: ' wasm.log | grep -vE '^test result: ok\. ' >/dev/null; then
              echo "::error::a test failed under wasmtime (${features:-default})"
              exit 1
            fi
            host=$(count host.log); wasm=$(count wasm.log)
            echo "${features:-default}: host ${host} passed, wasm32-wasip1 ${wasm} passed"
            if [ "${wasm}" -lt 1 ] || [ "${wasm}" -ne "${host}" ]; then
              echo "::error::wasm32-wasip1 passed ${wasm}, the host ${host} (${features:-default})"
              exit 1
            fi
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc (rand)
        run: cargo doc --no-deps --features rand
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: Doc (all features)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  test-public-siblings:
    name: Test (public siblings)
    runs-on: ubuntu-latest
    env:
      # the passed-test count of the feature set below at the commit that set it;
      # fewer passed tests (a removed or skipped test, or none at all) is a failure
      MIN_PASSED: "58"
    steps:
      # cargo reads the manifest of every path dependency, optional ones included, so
      # each sibling is checked out next to this repository at a fixed commit with the
      # workflow's own token: a sibling that is not public cannot be checked out
      - uses: actions/checkout@v5
        with:
          path: ALICE-Sign
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (lib, integration, doctests)
        working-directory: ALICE-Sign
        run: |
          # the default shell has no pipefail: without it cargo's exit status is lost in the pipe
          set -o pipefail
          log="$(mktemp)"
          cargo test --all-features 2>&1 | tee "${log}"
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED}), failed: ${failed}"
          if [ "${failed}" -ne 0 ] || grep -E '^test result: ' "${log}" | grep -vE '^test result: ok\. ' >/dev/null; then
            echo "::error::${failed} tests failed"
            exit 1
          fi
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi
