# ALICE-Law conformance manifest for this crate (alice-sign). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / mutant / since / note / reference_repo) is the "Manifest" section
# of docs/CONFORMANCE.md in that repository.
#
# The crate holds generic primitives only (Ed25519 signatures, SHA-256, a
# SHA-256 Merkle tree) and computes with integers and byte strings. The gates
# set up with the first commit are G1, G10, G12 and G14; the others were not
# measured and are `unverified`.

[G1]
status = "pass"
evidence = [
    "clippy.toml disallowed-methods lines 9 to 60: every f32 and f64 method gates.toml marks banned (sin_cos at lines 11 and 37) plus powi, the pending default; the list is the f32 / f64 method part of ALICE-DB's",
    ".github/workflows/ci.yml clippy job: default and rand, all targets (lines 88 and 90); no_std job, thumbv7em-none-eabihf (line 117); every run with -D warnings; scripts/preflight.sh lines 34, 38 and 53",
    "scripts/clippy_canary.py with scripts/clippy_canary_calls.tsv, generated from clippy.toml by scripts/gen_clippy_canary_calls.py (58 planted, 0 skipped; f64::sin and f64::sin_cos are lines 36 and 38), scripts/test_clippy_canary.py and scripts/test_gen_clippy_canary_calls.py (all four byte-identical to ALICE-DB); .github/workflows/ci.yml lines 96 to 102, scripts/preflight.sh lines 41 to 48",
    "Cargo.toml has no libm dependency, so no libm free function can be named",
]
mutant = "measured 2026-10-17, each reverted: deleting the f64::sin entry from clippy.toml makes scripts/clippy_canary.py exit 1; adding `pub fn probe(x: f64) -> f64 { x.sin() }` to src/hash.rs makes the default clippy step fail with disallowed method f64::sin"
since = ""
note = "the crate has no floating-point arithmetic; the list keeps a call from coming in unnoticed"
reference_repo = "ALICE-DB"

