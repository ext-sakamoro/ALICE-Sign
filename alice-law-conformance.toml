# ALICE-Law conformance manifest for this crate (alice-sign). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / mutant / since / note / reference_repo) is the "Manifest" section
# of docs/CONFORMANCE.md in that repository.
#
# The crate holds generic primitives only (Ed25519 signatures, SHA-256, a
# SHA-256 Merkle tree) and computes with integers and byte strings. The gates
# set up with the first commit are G1, G10, G12 and G14; the others were not
# measured and are `unverified`.

[G1]
status = "pass"
evidence = [
    "clippy.toml disallowed-methods (`clippy.toml#disallowed-methods = [`: every f32 and f64 method gates.toml marks banned, sin_cos at `clippy.toml#path = \"f32::sin_cos\"` and `clippy.toml#path = \"f64::sin_cos\"`, plus powi, the pending default, `clippy.toml#path = \"f64::powi\"`); the list is the f32 / f64 method part of ALICE-DB's",
    ".github/workflows/ci.yml clippy job: default and rand, all targets (`.github/workflows/ci.yml#name: Clippy (default, all targets)` and `.github/workflows/ci.yml#name: Clippy (rand, all targets)`); no_std job, thumbv7em-none-eabihf (`.github/workflows/ci.yml#name: Clippy (thumbv7em-none-eabihf)`); every run with -D warnings; scripts/preflight.sh runs the same (`scripts/preflight.sh#step \"ci.yml / clippy: Clippy (default, all targets)\"`, `scripts/preflight.sh#step \"ci.yml / clippy: Clippy (rand, all targets)\"` and `scripts/preflight.sh#step \"ci.yml / no_std: Build and clippy (thumbv7em-none-eabihf)\"`)",
    "scripts/clippy_canary.py with scripts/clippy_canary_calls.tsv, generated from clippy.toml by scripts/gen_clippy_canary_calls.py (58 planted, 0 skipped; f64::sin and f64::sin_cos are the rows `scripts/clippy_canary_calls.tsv#let _ = f64::sin;` and `scripts/clippy_canary_calls.tsv#let _ = f64::sin_cos;`), scripts/test_clippy_canary.py and scripts/test_gen_clippy_canary_calls.py (all four byte-identical to ALICE-DB); `.github/workflows/ci.yml#name: Clippy canary data (generator tests)`, `.github/workflows/ci.yml#name: Clippy canary data (generated from clippy.toml, no drift)`, `.github/workflows/ci.yml#name: Clippy canary (tests)` and `.github/workflows/ci.yml#name: Clippy canary (every planted banned call is flagged)`; `scripts/preflight.sh#step \"ci.yml / clippy: Clippy canary data (generator tests, generated from clippy.toml, no drift)\"`, `scripts/preflight.sh#step \"ci.yml / clippy: Clippy canary (tests)\"` and `scripts/preflight.sh#step \"ci.yml / clippy: Clippy canary (every planted banned call is flagged)\"`",
    "Cargo.toml has no libm dependency, so no libm free function can be named",
